name: Update summary

on:
  workflow_dispatch:
  repository_dispatch:
    types: [submodule-updated]   # sent by each sub-repo when it gets new commits (see README)
  push:
    branches: [master]
    paths: [".gitmodules", "scripts/**", ".github/workflows/summary.yml"]

permissions:
  contents: write

concurrency:
  group: summary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # For private submodules, use a PAT with repo access:
          # token: ${{ secrets.SUBMODULES_PAT }}

      - name: Point submodules at their latest remote commit
        run: git submodule update --init --remote --recursive

      - name: Build summary.json
        run: python3 scripts/build_summary.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update summary and submodules"
            git push
          fi